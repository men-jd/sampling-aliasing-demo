<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sampling & Aliasing</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  html,body{
    margin:0;width:100%;height:100%;background:#fff;
    font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif;overflow:hidden;
  }
  *{box-sizing:border-box}
  .app{width:100%;height:100%;display:flex;flex-direction:column;padding:12px 14px 10px;gap:8px;background:#fff}
  .controls{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:12px;flex:0 0 auto}
  .field label{display:block;margin:0 0 4px;color:#40464d;font-size:14px;font-weight:650}
  .field input{
    width:100%;height:38px;padding:0 10px;border:1px solid #c9cfd7;border-radius:8px;
    background:#fff;font-size:17px;color:#20252b;outline:none
  }
  .field input:focus{border-color:#64748b;box-shadow:0 0 0 2px rgba(100,116,139,.12)}
  .plot-wrap{flex:1 1 auto;min-height:320px;overflow:hidden;border:1px solid #d8dde4;border-radius:10px;background:#fff}
  svg{display:block;width:100%;height:100%}
  .error{height:16px;flex:0 0 16px;margin-top:-3px;font-size:12px;color:#b42318;visibility:hidden}
  @media(max-width:720px){.controls{grid-template-columns:repeat(2,minmax(120px,1fr))}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="controls">
    <div class="field"><label for="f0">f₀ (Hz)</label><input id="f0" type="number" min="0.001" step="0.1" value="10"></div>
    <div class="field"><label for="fs">fₛ (Hz)</label><input id="fs" type="number" min="0.001" step="0.1" value="100"></div>
    <div class="field"><label for="f1">f₁ (Hz)</label><input id="f1" type="number" min="0" step="0.1" value="20"></div>
    <div class="field"><label for="f2">f₂ (Hz)</label><input id="f2" type="number" min="0" step="0.1" value="80"></div>
  </div>
  <div class="error" id="error"></div>
  <div class="plot-wrap">
    <svg id="plot" viewBox="0 0 1200 700" preserveAspectRatio="none"></svg>
  </div>
</div>

<script>
(function(){
  const svg=document.getElementById('plot');
  const error=document.getElementById('error');
  const NS='http://www.w3.org/2000/svg';
  const ids=['f0','fs','f1','f2'];
  const inputs=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));

  function val(id){return Number(inputs[id].value)}
  function node(tag,attrs={}){
    const el=document.createElementNS(NS,tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,String(v));
    return el;
  }
  function text(x,y,str,size=15,fill='#5c6670',anchor='middle'){
    const el=node('text',{x,y,'font-size':size,fill,'text-anchor':anchor});
    el.textContent=str; return el;
  }
  function curvePath(freq,L,T,W,H,totalTime){
    const pts=1800; let d='';
    for(let i=0;i<=pts;i++){
      const t=totalTime*i/pts;
      const x=L+W*i/pts;
      const y=T+H/2-Math.cos(2*Math.PI*freq*t)*(H*.40);
      d+=(i===0?'M':'L')+x.toFixed(2)+' '+y.toFixed(2)+' ';
    }
    return d;
  }

  function render(){
    const f0=val('f0'),fs=val('fs'),f1=val('f1'),f2=val('f2');
    if(![f0,fs,f1,f2].every(Number.isFinite)||f0<=0||fs<=0||f1<0||f2<0){
      error.textContent='请输入有效频率'; error.style.visibility='visible'; return;
    }
    error.style.visibility='hidden';
    svg.replaceChildren();

    const VW=1200,VH=700;
    const m={l:58,r:20,t:18,b:30};
    const L=m.l,W=VW-m.l-m.r;
    const topT=28, topH=410;
    const botT=485, botH=150;
    const T0=1/f0;
    const totalTime=3*T0;

    // upper panel axis
    const y0=topT+topH/2;
    [-1,0,1].forEach(v=>{
      const y=y0-v*(topH*.40);
      svg.appendChild(node('line',{
        x1:L,y1:y,x2:L+W,y2:y,
        stroke:v===0?'#aeb6c0':'#edf0f3','stroke-width':v===0?1.5:1
      }));
    });
    [1,2].forEach(k=>{
      const x=L+W*(k/3);
      svg.appendChild(node('line',{
        x1:x,y1:topT,x2:x,y2:topT+topH,
        stroke:'#e5e9ee','stroke-width':1.1,'stroke-dasharray':'5 7'
      }));
    });

    // continuous curves: cosine form, so fs-f aliases exactly at sample instants
    svg.appendChild(node('path',{
      d:curvePath(f1,L,topT,W,topH,totalTime),fill:'none',
      stroke:'#2ca02c','stroke-width':2.5,'stroke-opacity':.92
    }));
    svg.appendChild(node('path',{
      d:curvePath(f2,L,topT,W,topH,totalTime),fill:'none',
      stroke:'#ff7f0e','stroke-width':2.5,'stroke-opacity':.92
    }));
    svg.appendChild(node('path',{
      d:curvePath(f0,L,topT,W,topH,totalTime),fill:'none',
      stroke:'#1f5fbf','stroke-width':4.4,'stroke-opacity':1
    }));

    // original f0 sample stems + points
    const nMax=Math.floor(totalTime*fs+1e-10);
    for(let n=0;n<=nMax;n++){
      const t=n/fs;
      if(t>totalTime+1e-12) continue;
      const x=L+(t/totalTime)*W;
      const y=y0-Math.cos(2*Math.PI*f0*t)*(topH*.40);
      svg.appendChild(node('line',{
        x1:x,y1:y0,x2:x,y2:y,stroke:'#d62728','stroke-width':1.6,'stroke-opacity':.42
      }));
      svg.appendChild(node('circle',{cx:x,cy:y,r:5.4,fill:'#d62728',stroke:'#fff','stroke-width':1.2}));
    }

    // lower sampled-sequence panel
    const by0=botT+botH/2;
    svg.appendChild(node('line',{x1:L,y1:by0,x2:L+W,y2:by0,stroke:'#aeb6c0','stroke-width':1.4}));

    // sample f1 and f2; use same x scale as time above
    for(let n=0;n<=nMax;n++){
      const t=n/fs;
      if(t>totalTime+1e-12) continue;
      const x=L+(t/totalTime)*W;
      const y1=by0-Math.cos(2*Math.PI*f1*t)*(botH*.38);
      const y2=by0-Math.cos(2*Math.PI*f2*t)*(botH*.38);

      // thin stems
      svg.appendChild(node('line',{x1:x,y1:by0,x2:x,y2:y1,stroke:'#2ca02c','stroke-width':1.4,'stroke-opacity':.35}));
      svg.appendChild(node('line',{x1:x,y1:by0,x2:x,y2:y2,stroke:'#ff7f0e','stroke-width':1.4,'stroke-opacity':.35}));

      // f1 filled green dot
      svg.appendChild(node('circle',{cx:x,cy:y1,r:5.4,fill:'#2ca02c',stroke:'#fff','stroke-width':1.1}));

      // f2 orange hollow ring, drawn on top: if aliasing, it sits exactly on green dot
      svg.appendChild(node('circle',{cx:x,cy:y2,r:8.2,fill:'none',stroke:'#ff7f0e','stroke-width':2.6}));
    }

    // Minimal labels
    svg.appendChild(text(L+W/2,462,'连续信号',14,'#6b7280'));
    svg.appendChild(text(L+W/2,674,'采样序列',14,'#6b7280'));
    svg.appendChild(text(L+W/2,695,'0  →  3T₀',14,'#6b7280'));
  }

  ids.forEach(id=>inputs[id].addEventListener('input',render));
  render();
  if(window.Office&&Office.onReady){Office.onReady(()=>{});}
})();
</script>
</body>
</html>
