<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sampling & Aliasing</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#ffffff;
    font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif;
    overflow:hidden;
  }
  *{box-sizing:border-box}
  .app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:14px 16px 12px;
    gap:10px;
    background:#fff;
  }
  .controls{
    display:grid;
    grid-template-columns:repeat(4,minmax(110px,1fr));
    gap:12px;
    flex:0 0 auto;
  }
  .field label{
    display:block;
    margin:0 0 5px;
    color:#40464d;
    font-size:15px;
    font-weight:650;
  }
  .field input{
    width:100%;
    height:40px;
    padding:0 10px;
    border:1px solid #c9cfd7;
    border-radius:8px;
    background:#fff;
    font-size:18px;
    color:#20252b;
    outline:none;
  }
  .field input:focus{
    border-color:#64748b;
    box-shadow:0 0 0 2px rgba(100,116,139,.12);
  }
  .plot-wrap{
    flex:1 1 auto;
    min-height:280px;
    overflow:hidden;
    border:1px solid #d8dde4;
    border-radius:10px;
    background:#fff;
  }
  svg{
    display:block;
    width:100%;
    height:100%;
  }
  .error{
    height:18px;
    flex:0 0 18px;
    margin-top:-4px;
    font-size:13px;
    color:#b42318;
    visibility:hidden;
  }
  @media(max-width:720px){
    .controls{grid-template-columns:repeat(2,minmax(120px,1fr))}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="controls">
    <div class="field">
      <label for="f0">f₀ (Hz)</label>
      <input id="f0" type="number" min="0.001" step="0.1" value="10">
    </div>
    <div class="field">
      <label for="fs">fₛ (Hz)</label>
      <input id="fs" type="number" min="0.001" step="0.1" value="100">
    </div>
    <div class="field">
      <label for="f1">f₁ (Hz)</label>
      <input id="f1" type="number" min="0" step="0.1" value="80">
    </div>
    <div class="field">
      <label for="f2">f₂ (Hz)</label>
      <input id="f2" type="number" min="0" step="0.1" value="110">
    </div>
  </div>

  <div class="error" id="error"></div>

  <div class="plot-wrap">
    <svg id="plot" viewBox="0 0 1200 620" preserveAspectRatio="none"></svg>
  </div>
</div>

<script>
(function(){
  const svg = document.getElementById('plot');
  const error = document.getElementById('error');
  const NS = 'http://www.w3.org/2000/svg';
  const ids = ['f0','fs','f1','f2'];
  const inputs = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

  function val(id){ return Number(inputs[id].value); }

  function node(tag, attrs={}){
    const el = document.createElementNS(NS, tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k, String(v));
    return el;
  }

  function curvePath(freq, L, T, W, H, totalTime){
    const pts = 1800;
    let d = "";
    for(let i=0;i<=pts;i++){
      const t = totalTime * i / pts;
      const x = L + W * i / pts;
      const y = T + H/2 - Math.sin(2*Math.PI*freq*t) * (H*0.38);
      d += (i===0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
    }
    return d;
  }

  function render(){
    const f0 = val('f0');
    const fs = val('fs');
    const f1 = val('f1');
    const f2 = val('f2');

    if(!Number.isFinite(f0) || !Number.isFinite(fs) ||
       !Number.isFinite(f1) || !Number.isFinite(f2) ||
       f0 <= 0 || fs <= 0 || f1 < 0 || f2 < 0){
      error.textContent = "请输入有效频率";
      error.style.visibility = "visible";
      return;
    }
    error.style.visibility = "hidden";

    svg.replaceChildren();

    const VW = 1200, VH = 620;
    const m = {l:58, r:20, t:22, b:34};
    const L = m.l, T = m.t;
    const W = VW - m.l - m.r;
    const H = VH - m.t - m.b;
    const y0 = T + H/2;

    const T0 = 1 / f0;
    const totalTime = 3 * T0;

    // subtle horizontal guides
    [-1,0,1].forEach(v=>{
      const y = y0 - v*(H*0.38);
      svg.appendChild(node('line',{
        x1:L,y1:y,x2:L+W,y2:y,
        stroke:v===0 ? '#aeb6c0' : '#edf0f3',
        'stroke-width':v===0 ? 1.6 : 1
      }));
    });

    // vertical period boundaries: T0, 2T0
    [1,2].forEach(k=>{
      const x = L + W*(k/3);
      svg.appendChild(node('line',{
        x1:x,y1:T,x2:x,y2:T+H,
        stroke:'#e5e9ee',
        'stroke-width':1.2,
        'stroke-dasharray':'5 7'
      }));
    });

    // f1 and f2 first
    svg.appendChild(node('path',{
      d:curvePath(f1,L,T,W,H,totalTime),
      fill:'none',
      stroke:'#2ca02c',
      'stroke-width':2.4,
      'stroke-opacity':0.9,
      'stroke-linecap':'round',
      'stroke-linejoin':'round'
    }));

    svg.appendChild(node('path',{
      d:curvePath(f2,L,T,W,H,totalTime),
      fill:'none',
      stroke:'#ff7f0e',
      'stroke-width':2.4,
      'stroke-opacity':0.9,
      'stroke-linecap':'round',
      'stroke-linejoin':'round'
    }));

    // main signal
    svg.appendChild(node('path',{
      d:curvePath(f0,L,T,W,H,totalTime),
      fill:'none',
      stroke:'#1f5fbf',
      'stroke-width':4.5,
      'stroke-opacity':1,
      'stroke-linecap':'round',
      'stroke-linejoin':'round'
    }));

    // Sampling stems & points drawn LAST so they always stay visible
    const nMax = Math.floor(totalTime * fs + 1e-10);

    for(let n=0;n<=nMax;n++){
      const t = n/fs;
      if(t > totalTime + 1e-12) continue;

      const x = L + (t/totalTime)*W;
      const amp = Math.sin(2*Math.PI*f0*t);
      const y = y0 - amp*(H*0.38);

      // stem
      svg.appendChild(node('line',{
        x1:x,y1:y0,x2:x,y2:y,
        stroke:'#d62728',
        'stroke-width':2.1,
        'stroke-opacity':0.72
      }));

      // sample point halo
      svg.appendChild(node('circle',{
        cx:x,cy:y,r:8.2,
        fill:'#ffffff',
        'fill-opacity':0.96
      }));

      // sample point
      svg.appendChild(node('circle',{
        cx:x,cy:y,r:6.0,
        fill:'#d62728',
        stroke:'#b51f20',
        'stroke-width':1.1
      }));
    }
  }

  ids.forEach(id => inputs[id].addEventListener('input', render));
  render();

  if(window.Office && Office.onReady){
    Office.onReady(()=>{});
  }
})();
</script>
</body>
</html>
